[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pardot-mcp"
version = "0.1.0"
description = "A uvx-runnable MCP server for the Salesforce Account Engagement (Pardot) v5 API — pure Python, no JDBC drivers or JVM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JustParent" }]
keywords = ["mcp", "pardot", "account-engagement", "salesforce", "marketing", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # fastmcp major versions are breaking (1->2 moved packages, 2->3 changed
    # APIs again). This server is written against the FastMCP 2.x API, so the
    # upper bound is deliberate — bump it only as an explicit migration.
    "fastmcp>=2.9,<3",
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23"]

[project.scripts]
pardot-mcp = "pardot_mcp.server:main"
pardot-mcp-auth = "pardot_mcp.auth:auth_main"

[project.urls]
Homepage = "https://github.com/JustParent/pardot-mcp"
Repository = "https://github.com/JustParent/pardot-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/pardot_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
